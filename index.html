<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      padding-bottom: 70px;
    }

    /* TOP BAR */

    .topbar {
      height: 58px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #1877f2;
    }

    .top-icons {
      display: flex;
      gap: 10px;
    }

    .circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: #e4e6eb;
      font-size: 18px;
    }

    /* CONTENT */

    .content {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
    }

    /* CREATE POST */

    .create-post {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .profile-small {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .post-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 22px;
      padding: 12px 15px;
      color: #65676b;
      background: #f0f2f5;
    }

    .post-actions {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #eee;
      margin-top: 15px;
      padding-top: 12px;
    }

    .action {
      border: none;
      background: none;
      font-size: 14px;
      font-weight: bold;
    }

    /* POST */

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-name {
      font-weight: bold;
    }

    .post-time {
      color: #65676b;
      font-size: 12px;
    }

    .post-text {
      margin: 15px 0;
      line-height: 1.5;
    }

    .post-buttons {
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      padding: 8px 0;
      display: flex;
      justify-content: space-around;
    }

    .post-buttons button {
      border: none;
      background: none;
      font-size: 14px;
      padding: 7px;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .nav-button {
      border: none;
      background: none;
      font-size: 20px;
    }

    .nav-label {
      display: block;
      font-size: 10px;
      margin-top: 3px;
      color: #555;
    }

    /* SECTIONS */

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    h2 {
      padding: 15px;
      margin: 0;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #65676b;
    }

  </style>
</head>

<body>

  <!-- TOP BAR -->

  <header class="topbar">

    <div class="logo">
      Social
    </div>

    <div class="top-icons">

      <button class="circle">
        🔍
      </button>

      <button class="circle">
        🔔
      </button>

    </div>

  </header>


  <!-- MAIN CONTENT -->

  <main class="content">


    <!-- HOME -->

    <section id="home" class="section active">

      <!-- CREATE POST -->

      <div class="card">

        <div class="create-post">

          <div class="profile-small" id="avatar">
            ?
          </div>

          <div
            class="post-input"
            onclick="createPost()"
          >
            What's on your mind?
          </div>

        </div>

        <div class="post-actions">

          <button class="action">
            📷 Photo
          </button>

          <button class="action">
            😊 Feeling
          </button>

          <button class="action">
            📍 Check in
          </button>

        </div>

      </div>


      <!-- SAMPLE POST -->

      <div class="card">

        <div class="post-header">

          <div class="profile-small">
            S
          </div>

          <div>

            <div class="post-name">
              Social
            </div>

            <div class="post-time">
              Just now
            </div>

          </div>

        </div>

        <div class="post-text">
          Welcome to your new social network! 🎉
        </div>

        <div class="post-buttons">

          <button onclick="likePost(this)">
            👍 Like
          </button>

          <button>
            💬 Comment
          </button>

          <button>
            ↗️ Share
          </button>

        </div>

      </div>

    </section>


    <!-- FRIENDS -->

    <section id="friends" class="section">

      <h2>👥 Friends</h2>

      <div class="card empty">

        Find people and connect with friends.

      </div>

    </section>


    <!-- MESSAGES -->

    <section id="messages" class="section">

      <h2>💬 Messages</h2>

      <div class="card empty">

        Your conversations will appear here.

      </div>

    </section>


    <!-- NOTIFICATIONS -->

    <section id="notifications" class="section">

      <h2>🔔 Notifications</h2>

      <div class="card empty">

        Your notifications will appear here.

      </div>

    </section>


    <!-- PROFILE -->

    <section id="profile" class="section">

      <h2>👤 Profile</h2>

      <div class="card">

        <div
          class="profile-small"
          id="profileAvatar"
        >
          ?
        </div>

        <h3 id="profileName">
          Telegram User
        </h3>

        <p id="profileUsername"></p>

        <button onclick="editProfile()">
          Edit Profile
        </button>

      </div>

    </section>


  </main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <button
      class="nav-button"
      onclick="showSection('home')"
    >
      🏠
      <span class="nav-label">Home</span>
    </button>

    <button
      class="nav-button"
      onclick="showSection('friends')"
    >
      👥
      <span class="nav-label">Friends</span>
    </button>

    <button
      class="nav-button"
      onclick="showSection('messages')"
    >
      💬
      <span class="nav-label">Messages</span>
    </button>

    <button
      class="nav-button"
      onclick="showSection('notifications')"
    >
      🔔
      <span class="nav-label">Alerts</span>
    </button>

    <button
      class="nav-button"
      onclick="showSection('profile')"
    >
      👤
      <span class="nav-label">Profile</span>
    </button>

  </nav>


  <script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    const user =
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user;


    if (user) {

      const name =
        [user.first_name, user.last_name]
        .filter(Boolean)
        .join(" ");

      document.getElementById(
        "profileName"
      ).textContent = name;

      document.getElementById(
        "profileUsername"
      ).textContent =
        user.username
        ? "@" + user.username
        : "";

      const firstLetter =
        (user.first_name || "U")
        .charAt(0)
        .toUpperCase();

      document.getElementById(
        "avatar"
      ).textContent = firstLetter;

      document.getElementById(
        "profileAvatar"
      ).textContent = firstLetter;

    }


    function showSection(id) {

      document
        .querySelectorAll(".section")
        .forEach(function(section) {

          section.classList.remove(
            "active"
          );

        });

      document
        .getElementById(id)
        .classList.add("active");

    }


    function createPost() {

      alert(
        "The post creator will be added next."
      );

    }


    function likePost(button) {

      button.textContent =
        "❤️ Liked";

    }


    function editProfile() {

      alert(
        "Profile editing will be added next."
      );

    }

  </script>

</body>
</html>
