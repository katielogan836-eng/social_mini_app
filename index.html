<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    .header {
      background: #1877f2;
      color: white;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .profile {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: #1877f2;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px 0;
      width: 100%;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    My Social
  </div>

  <div class="container">

    <div class="profile">
      <div class="avatar">👤</div>
      <h2 id="username">Welcome!</h2>
      <p>Your Telegram Mini App profile</p>
    </div>

    <div class="card">
      <h3>Find People</h3>

      <input
        type="text"
        id="searchInput"
        placeholder="Search for people..."
      >

      <button onclick="searchPeople()">
        Search
      </button>

      <div id="searchResult"></div>
    </div>

    <div class="card">
      <h3>Friends</h3>
      <p id="friendsCount">No friends yet.</p>
      <button onclick="showFriends()">
        View Friends
      </button>
    </div>

    <div class="card">
      <h3>Messages</h3>
      <p>Chat with your friends.</p>
      <button onclick="openMessages()">
        Open Messages
      </button>
    </div>

    <div class="card">
      <h3>Pages</h3>
      <p>Create and manage social pages.</p>
      <button onclick="openPages()">
        View Pages
      </button>
    </div>

  </div>

  <script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    if (tg.initDataUnsafe &&
        tg.initDataUnsafe.user) {

      const user = tg.initDataUnsafe.user;

      document.getElementById("username").textContent =
        user.first_name || "Telegram User";
    }

    function searchPeople() {

      const name =
        document.getElementById("searchInput").value.trim();

      const result =
        document.getElementById("searchResult");

      if (!name) {
        result.innerHTML =
          "<p>Please enter a name.</p>";
        return;
      }

      result.innerHTML = `
        <div class="card">
          <strong>${name}</strong>
          <p>Social profile</p>
          <button onclick="sendFriendRequest('${name}')">
            Add Friend
          </button>
        </div>
      `;
    }

    function sendFriendRequest(name) {
      alert("Friend request sent to " + name);
    }

    function showFriends() {
      alert("Your friends will appear here.");
    }

    function openMessages() {
      alert("Messaging section coming next.");
    }

    function openPages() {
      alert("Pages section coming next.");
    }

  </script>

</body>
</html>
