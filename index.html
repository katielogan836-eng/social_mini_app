<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #1c1e21;
}

.top {
  background: white;
  padding: 18px;
  font-size: 32px;
  font-weight: bold;
  color: #1877f2;
}

.page {
  display: none;
  min-height: calc(100vh - 130px);
  padding-bottom: 80px;
}

.page.active {
  display: block;
}

.card {
  background: white;
  margin: 12px 0;
  padding: 18px;
  border-radius: 12px;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-size: 16px;
  margin-bottom: 15px;
}

.person {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #1877f2;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}

.person-info {
  flex: 1;
}

.person-name {
  font-weight: bold;
  font-size: 17px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
}

.add {
  background: #1877f2;
  color: white;
}

.pending {
  background: #e4e6eb;
  color: #555;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  z-index: 10;
}

.nav {
  flex: 1;
  border-radius: 0;
  background: white;
  color: #555;
  font-size: 12px;
}

.nav span {
  display: block;
  font-size: 24px;
  margin-bottom: 3px;
}

.nav.active {
  color: #1877f2;
}
</style>
</head>

<body>

<div class="top">Social</div>

<!-- HOME -->
<div id="home" class="page active">
  <div class="card">
    <h2>Welcome 👋</h2>
    <p>Welcome to your social network.</p>
  </div>
</div>

<!-- FRIENDS -->
<div id="friends" class="page">
  <div class="card">
    <h2>Friends 👥</h2>

    <input
      class="search"
      id="friendSearch"
      placeholder="Search people..."
      oninput="searchFriends()"
    >

    <div id="peopleList"></div>
  </div>
</div>

<!-- MESSAGES -->
<div id="messages" class="page">
  <div class="card">
    <h2>Messages 💬</h2>
    <p>Your conversations will appear here.</p>
  </div>
</div>

<!-- ALERTS -->
<div id="alerts" class="page">
  <div class="card">
    <h2>Alerts 🔔</h2>
    <p id="alertText">No new notifications.</p>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <div class="card">
    <h2>My Profile 👤</h2>
    <p><b>Name:</b> My Social Profile</p>
    <p><b>Status:</b> Online</p>
  </div>
</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom">

  <button class="nav active" onclick="openPage('home', this)">
    <span>🏠</span>
    Home
  </button>

  <button class="nav" onclick="openPage('friends', this)">
    <span>👥</span>
    Friends
  </button>

  <button class="nav" onclick="openPage('messages', this)">
    <span>💬</span>
    Messages
  </button>

  <button class="nav" onclick="openPage('alerts', this)">
    <span>🔔</span>
    Alerts
  </button>

  <button class="nav" onclick="openPage('profile', this)">
    <span>👤</span>
    Profile
  </button>

</div>

<script>

const people = [
  {name: "Alex Johnson", letter: "A"},
  {name: "Maria Smith", letter: "M"},
  {name: "Daniel Brown", letter: "D"},
  {name: "Sophia Williams", letter: "S"},
  {name: "James Wilson", letter: "J"},
  {name: "Emma Davis", letter: "E"}
];

let requests = [];

function openPage(pageId, button) {

  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  document.getElementById(pageId).classList.add("active");

  document.querySelectorAll(".nav").forEach(nav => {
    nav.classList.remove("active");
  });

  button.classList.add("active");

  if (pageId === "friends") {
    showPeople(people);
  }
}

function showPeople(list) {

  const container = document.getElementById("peopleList");

  container.innerHTML = "";

  list.forEach((person, index) => {

    const div = document.createElement("div");
    div.className = "person";

    const isPending = requests.includes(index);

    div.innerHTML = `
      <div class="avatar">${person.letter}</div>

      <div class="person-info">
        <div class="person-name">${person.name}</div>
        <small>Social user</small>
      </div>

      <button
        class="${isPending ? "pending" : "add"}"
        onclick="sendRequest(${index})"
        ${isPending ? "disabled" : ""}
      >
        ${isPending ? "Requested" : "Add Friend"}
      </button>
    `;

    container.appendChild(div);
  });
}

function sendRequest(index) {

  if (!requests.includes(index)) {
    requests.push(index);
  }

  document.getElementById("alertText").innerText =
    "Friend request sent to " + people[index].name + " ✅";

  showPeople(people);
}

function searchFriends() {

  const text =
    document.getElementById("friendSearch").value.toLowerCase();

  const results = people.filter(person =>
    person.name.toLowerCase().includes(text)
  );

  showPeople(results);
}

showPeople(people);

</script>

</body>
</html>
